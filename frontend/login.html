<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Login | OM Constructions</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <!-- NAV BAR -->
    <nav id="navbar" class="scrolled">
        <div class="container nav-container">
            <a href="./index.html" class="nav-brand">OM<span>Constructions</span></a>
            <div class="nav-links">
                <a href="./index.html#hero">Home</a>
                <a href="./index.html#services">Services</a>
                <a href="./index.html#about">About</a>
                <a href="./index.html#cta">Contact</a>
            </div>
        </div>
    </nav>

    <!-- LOGIN FORM SECTION -->
    <main class="auth-page-wrapper">
        <div class="blueprint-animation-container" aria-hidden="true">
            <svg class="blueprint-svg" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
                <path class="blueprint-line bp-1" d="M0,200 L1440,200" />
                <path class="blueprint-line bp-2" d="M300,0 L300,900" />
                <path class="blueprint-line bp-3" d="M1100,0 L1100,900" />
                <path class="blueprint-line bp-4" d="M150,600 L1290,600 M150,600 L150,800 L450,800 L450,600" />
                <path class="blueprint-line bp-5" d="M800,100 L1200,100 L1200,500 L800,500 Z" />
                <path class="blueprint-line bp-arc bp-1" d="M1200,500 A 300 300 0 0 1 900,800" />
                <path class="blueprint-line bp-arc bp-2" d="M300,200 A 150 150 0 0 0 150,350" />
            </svg>
        </div>
        <div class="auth-card">
            <div class="auth-header">
                <span class="auth-eyebrow">Customer Portal</span>
                <h1 id="authMainTitle">Welcome Back</h1>
                <p id="authSubtitle">Log in to review your enquiries and project consultation status.</p>
            </div>

            <!-- Tab Switcher (Log In vs Sign Up) -->
            <div class="auth-tabs" style="display: flex; gap: 6px; margin-bottom: 20px; background: #f1f5f9; padding: 4px; border-radius: 8px;">
                <button type="button" id="tabLogin" class="auth-tab-btn" style="flex: 1; padding: 10px 14px; border: none; border-radius: 6px; font-weight: 600; font-size: 0.92rem; cursor: pointer; transition: all 0.2s; background: #07152F; color: #FFFFFF;">Log In</button>
                <button type="button" id="tabSignup" class="auth-tab-btn" style="flex: 1; padding: 10px 14px; border: none; border-radius: 6px; font-weight: 600; font-size: 0.92rem; cursor: pointer; transition: all 0.2s; background: transparent; color: #64748b;">Sign Up</button>
            </div>

            <!-- Inline Error Banner -->
            <div id="errorMessage" class="auth-error-banner" role="alert"></div>

            <!-- 1. LOGIN FORM -->
            <form id="loginForm" class="auth-form" novalidate>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" required autocomplete="email">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password">
                </div>

                <button type="submit" id="submitBtn" class="auth-btn-submit">
                    <span>Log In</span>
                </button>
            </form>

            <!-- 2. SIGNUP FORM -->
            <form id="signupForm" class="auth-form" style="display: none;" novalidate>
                <div class="form-group">
                    <label for="signupName">Full Name</label>
                    <input type="text" id="signupName" name="name" required autocomplete="name">
                </div>

                <div class="form-group">
                    <label for="signupEmail">Email Address</label>
                    <input type="email" id="signupEmail" name="email" required autocomplete="email">
                </div>

                <div class="form-group">
                    <label for="signupPassword">Password (min. 8 characters)</label>
                    <input type="password" id="signupPassword" name="password" required autocomplete="new-password">
                </div>

                <div class="form-group">
                    <label for="signupConfirmPassword">Confirm Password</label>
                    <input type="password" id="signupConfirmPassword" name="confirm_password" required autocomplete="new-password">
                </div>

                <button type="submit" id="signupSubmitBtn" class="auth-btn-submit">
                    <span>Create Account</span>
                </button>
            </form>

            <div class="auth-footer-text" id="authFooterText">
                <span id="footerTogglePrompt">Don't have an account?</span> 
                <a href="#" id="toggleAuthMode">Create one now</a>
            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <footer>
        <div class="container">
            <div class="footer-bottom" style="border-top: none; padding-top: 0; justify-content: center;">
                <span>&copy; 2026 OM Constructions & Structural Engineering Consultants. All rights reserved.</span>
            </div>
        </div>
    </footer>

    <script src="./src/blueprint-sync.js"></script>
    <script type="module">
        import { login, signup, getCurrentUser, resendVerification } from "./src/auth.js";

        const urlParams = new URLSearchParams(window.location.search);
        let redirectUrl = urlParams.get("redirect") || "";
        let reason = urlParams.get("reason") || "";

        // Check for any preserved enquiry draft in sessionStorage
        let savedDraftEmail = "";
        let savedDraftName = "";
        try {
            const gd = JSON.parse(sessionStorage.getItem("om_global_enquiry_draft") || "{}");
            if (gd.email) savedDraftEmail = gd.email;
            if (gd.name) savedDraftName = gd.name;
        } catch (e) {}

        if (!savedDraftEmail) {
            try {
                for (let i = 0; i < sessionStorage.length; i++) {
                    const key = sessionStorage.key(i);
                    if (key && key.startsWith("om_service_detail_enquiry_")) {
                        const sd = JSON.parse(sessionStorage.getItem(key) || "{}");
                        if (sd.email) savedDraftEmail = sd.email;
                        if (sd.name) savedDraftName = sd.name;
                        break;
                    }
                }
            } catch (e) {}
        }

        if (!redirectUrl && savedDraftEmail) {
            redirectUrl = "./index.html#cta";
            reason = "enquiry_submit";
        }

        // Auto-prefill email and name
        const loginEmailInput = document.getElementById("email");
        const signupEmailInput = document.getElementById("signupEmail");
        const signupNameInput = document.getElementById("signupName");

        if (savedDraftEmail) {
            if (loginEmailInput) loginEmailInput.value = savedDraftEmail;
            if (signupEmailInput) signupEmailInput.value = savedDraftEmail;
        }
        if (savedDraftName && signupNameInput) {
            signupNameInput.value = savedDraftName;
        }

        // Show banner if redirect URL or saved enquiry draft is present
        if (redirectUrl || savedDraftEmail || reason) {
            const header = document.querySelector(".auth-header");
            if (header) {
                let noticeMsg = "<strong>Sign In or Sign Up to Submit Enquiry:</strong> Please log in or create an account to submit your engineering enquiry. Your enquiry details have been preserved.";
                if (reason === "pricing_access" || redirectUrl.includes("cost") || redirectUrl.includes("price")) {
                    noticeMsg = "<strong>Verified Pricing Access:</strong> Please sign in or register to view itemized construction cost rates.";
                } else if (reason === "service_access" || redirectUrl.includes("/services/")) {
                    noticeMsg = "<strong>Service Scope & Specifications:</strong> Please sign in or register to view full blueprints and engineering specifications.";
                }

                const banner = document.createElement("div");
                banner.className = "auth-redirect-notice";
                banner.style.cssText = "background: rgba(201, 151, 34, 0.12); border: 1px solid rgba(201, 151, 34, 0.35); color: #B37D14; padding: 11px 16px; border-radius: 6px; font-size: 0.88rem; margin-top: 14px; text-align: center;";
                banner.innerHTML = `<div style="display:inline-flex; align-items:center; gap:8px; line-height:1.4;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#C99722" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/></svg><span>${noticeMsg}</span></div>`;
                header.appendChild(banner);
            }
        }

        // Tab switching logic (Log In vs Sign Up)
        const tabLogin = document.getElementById("tabLogin");
        const tabSignup = document.getElementById("tabSignup");
        const loginForm = document.getElementById("loginForm");
        const signupForm = document.getElementById("signupForm");
        const authMainTitle = document.getElementById("authMainTitle");
        const authSubtitle = document.getElementById("authSubtitle");
        const footerTogglePrompt = document.getElementById("footerTogglePrompt");
        const toggleAuthMode = document.getElementById("toggleAuthMode");
        const errorBanner = document.getElementById("errorMessage");

        function showError(msg) {
            errorBanner.textContent = msg;
            errorBanner.style.display = "block";
        }

        function hideError() {
            errorBanner.textContent = "";
            errorBanner.style.display = "none";
        }

        function setAuthMode(mode) {
            hideError();
            if (mode === "signup") {
                tabSignup.style.background = "#07152F";
                tabSignup.style.color = "#FFFFFF";
                tabLogin.style.background = "transparent";
                tabLogin.style.color = "#64748b";
                loginForm.style.display = "none";
                signupForm.style.display = "flex";
                authMainTitle.textContent = "Create Account";
                authSubtitle.textContent = "Register a client account to submit and track your enquiries.";
                footerTogglePrompt.textContent = "Already have an account?";
                toggleAuthMode.textContent = "Log in here";
            } else {
                tabLogin.style.background = "#07152F";
                tabLogin.style.color = "#FFFFFF";
                tabSignup.style.background = "transparent";
                tabSignup.style.color = "#64748b";
                signupForm.style.display = "none";
                loginForm.style.display = "flex";
                authMainTitle.textContent = "Welcome Back";
                authSubtitle.textContent = "Log in to review your enquiries and project consultation status.";
                footerTogglePrompt.textContent = "Don't have an account?";
                toggleAuthMode.textContent = "Create one now";
            }
        }

        tabLogin.addEventListener("click", () => setAuthMode("login"));
        tabSignup.addEventListener("click", () => setAuthMode("signup"));
        toggleAuthMode.addEventListener("click", (e) => {
            e.preventDefault();
            if (loginForm.style.display === "none") {
                setAuthMode("login");
            } else {
                setAuthMode("signup");
            }
        });

        // Check if query specifies mode=signup
        if (urlParams.get("mode") === "signup") {
            setAuthMode("signup");
        }

        // If already logged in, redirect straight to target page
        getCurrentUser().then(user => {
            if (user) window.location.href = redirectUrl || "./my-requests.html";
        });

        // 1. LOGIN FORM SUBMISSION
        const submitBtn = document.getElementById("submitBtn");
        loginForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            hideError();

            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;

            if (!email || !password) {
                showError("Please enter both your email address and password.");
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = "<span>Logging in...</span>";

            try {
                await login({ email, password });
                window.location.href = redirectUrl || "./my-requests.html";
            } catch (err) {
                submitBtn.disabled = false;
                submitBtn.innerHTML = "<span>Log In</span>";

                if (err.status === 403 || err.code === "email_not_verified" || (err.message && err.message.includes("email_not_verified"))) {
                    errorBanner.innerHTML = `
                        <div style="display: flex; flex-direction: column; gap: 8px;">
                            <span><strong>Email Not Verified:</strong> Please check your inbox and verify your email address before logging in.</span>
                            <button type="button" id="resendVerificationBtn" class="btn-sm-outline" style="background: #FFFFFF; font-size: 0.82rem; padding: 6px 12px; align-self: flex-start; cursor: pointer;">
                                Resend verification email
                            </button>
                            <span id="resendStatusText" style="font-size: 0.82rem; color: #047857; display: none;"></span>
                        </div>
                    `;
                    errorBanner.style.display = "block";

                    const resendBtn = document.getElementById("resendVerificationBtn");
                    const resendStatusText = document.getElementById("resendStatusText");

                    resendBtn?.addEventListener("click", async () => {
                        resendBtn.disabled = true;
                        resendBtn.textContent = "Sending link...";
                        try {
                            const res = await resendVerification(email);
                            resendStatusText.textContent = res.message || "If that account exists, a new verification link was sent.";
                            resendStatusText.style.display = "block";
                            resendBtn.style.display = "none";
                        } catch (resendErr) {
                            resendStatusText.textContent = resendErr.message || "Failed to resend link.";
                            resendStatusText.style.color = "#991B1B";
                            resendStatusText.style.display = "block";
                            resendBtn.disabled = false;
                            resendBtn.textContent = "Resend verification email";
                        }
                    });
                } else {
                    showError(err.message || "Invalid email or password.");
                }
            }
        });

        // 2. SIGNUP FORM SUBMISSION
        const signupSubmitBtn = document.getElementById("signupSubmitBtn");
        signupForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            hideError();

            const name = document.getElementById("signupName").value.trim();
            const email = document.getElementById("signupEmail").value.trim();
            const password = document.getElementById("signupPassword").value;
            const confirmPassword = document.getElementById("signupConfirmPassword").value;

            if (!name) {
                showError("Please enter your full name.");
                return;
            }
            if (!email) {
                showError("Please enter a valid email address.");
                return;
            }
            if (password.length < 8) {
                showError("Password must be at least 8 characters long.");
                return;
            }
            if (password !== confirmPassword) {
                showError("Passwords do not match. Please re-enter.");
                return;
            }

            signupSubmitBtn.disabled = true;
            signupSubmitBtn.innerHTML = "<span>Creating Account...</span>";

            try {
                await signup({ name, email, password });
                const authCard = document.querySelector(".auth-card");
                authCard.innerHTML = `
                    <div style="text-align: center; padding: 10px 0;">
                        <div style="font-size: 3.2rem; color: #10B981; margin-bottom: 14px;">✉️</div>
                        <span class="auth-eyebrow">Verification Email Sent</span>
                        <h1 style="font-family: var(--font-heading); font-size: 1.75rem; color: var(--navy-primary); margin: 0 0 12px;">Check Your Inbox</h1>
                        <p style="color: var(--text-dark); font-size: 1.02rem; line-height: 1.6; margin-bottom: 10px;">
                            We've sent a verification link to <strong style="color: var(--navy-primary);">${email}</strong>.
                        </p>
                        <p style="color: var(--text-muted); font-size: 0.92rem; line-height: 1.5; margin-bottom: 26px;">
                            Please click the link in your email within 24 hours to activate your account and submit your enquiry.
                        </p>
                        <a href="./login.html?redirect=${encodeURIComponent(redirectUrl)}" class="btn-primary" style="display: inline-block; width: 100%; box-sizing: border-box; text-align: center;">
                            Go to Login
                        </a>
                    </div>
                `;
            } catch (err) {
                showError(err.message || "Unable to create account. Please try again.");
                signupSubmitBtn.disabled = false;
                signupSubmitBtn.innerHTML = "<span>Create Account</span>";
            }
        });
    </script>
</body>
</html>
