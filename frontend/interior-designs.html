<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OUR INTERIOR DESIGNS | OM Constructions</title>

    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=12">
</head>
<body style="overflow-y: auto; overflow-x: hidden; background-color: var(--light-bg);">
    <!-- NAV BAR -->
    <nav id="navbar" style="background-color: var(--navy-primary); opacity: 1; visibility: visible; position: sticky; top: 0; z-index: 1000; box-shadow: 0 4px 20px rgba(0,0,0,0.1);">
        <div class="container nav-container">
            <a href="index.html" class="nav-brand">OM<span class="brand-long">Constructions</span></a>
            <div class="nav-menu">
                <div class="nav-links">
                    <a href="index.html#hero" class="nav-link-item">Home</a>
                    <a href="index.html#services" class="nav-link-item">Services</a>
                </div>
            </div>
        </div>
    </nav>

    <main id="homepage-content" style="opacity: 1; visibility: visible; padding-top: 60px;">
        <section class="section-light">
            <div class="container">
                <span class="eyebrow">PORTFOLIO</span>
                <h1 class="section-title">OUR INTERIOR DESIGNS</h1>
                <p class="section-subtitle" style="margin-bottom: 60px;">Explore our complete collection of exquisite interior environments.</p>

                <div class="interior-gallery-grid" id="interior-gallery-container">
                    <!-- Cards will be dynamically injected here -->
                </div>
            </div>
        </section>

        <script src="./src/interiorDesigns.js?v=1"></script>
        <script>
            document.addEventListener('DOMContentLoaded', () => {
                if(typeof renderInteriorDesigns === 'function') {
                    renderInteriorDesigns('interior-gallery-container', false);
                }
            });
        </script>
    </main>

    <!-- FOOTER -->
    <footer style="margin-top: 60px;">
        <div class="container">
            <div class="footer-grid">
                <div class="footer-brand">
                    <h3>OM CONSTRUCTIONS</h3>
                    <p>& ENGINEERING CONSULTANTS</p>
                </div>
            </div>
            <div class="footer-bottom">
                <span>&copy; 2026 OM Constructions. All rights reserved.</span>
            </div>
        </div>
    </footer>
</body>
</html>
